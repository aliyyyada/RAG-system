# Режим без сертификата: сайт по обычному http на порту 80.
# Включается строкой PLAIN_HTTP=true в .env (см. proxy/choose-config.sh).
# Основной режим — HTTPS (proxy/nginx.conf). Без шифрования пароль при входе идёт по сети
# открытым текстом, поэтому этот режим — для тестового стенда и временной работы, пока нет
# сертификата от администраторов.
server {
    listen 80;
    server_name _;

    server_tokens off;

    client_max_body_size 200m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # DNS Docker: адрес app ищется заново, даже если контейнер пересоздан (иначе 502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://app:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        # Потоковые ответы (SSE): без буфера, иначе heartbeat застрянет в nginx.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
