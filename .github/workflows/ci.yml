name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend — линтер, миграции, тесты
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://rag:rag@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check . ../scripts/bench
          ruff format --check . ../scripts/bench
      - name: Миграции применяются и откатываются
        env:
          DATABASE_URL: postgresql+asyncpg://rag:rag@localhost:5432/rag
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Pytest
        run: pytest -v

  docker:
    name: Docker — сборка образов и smoke-тест
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.cpu.yml config -q
      - name: Сборка образов
        run: docker compose build
      - name: Smoke-тест — proxy (TLS) + app + postgres без GPU
        run: |
          ./scripts/dev-cert.sh
          docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d proxy app
          for i in $(seq 1 30); do
            curl -skf https://localhost/api/health/ready && break
            sleep 2
          done
          curl -skf https://localhost/api/health/ready
          # Обычный HTTP только перенаправляет на HTTPS
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = "301"
          # Поток SSE доходит через nginx с heartbeat
          curl -skN --max-time 10 "https://localhost/api/diag/sse?seconds=5" | tee /tmp/sse.txt
          grep -q ": ping" /tmp/sse.txt
          grep -q "event: done" /tmp/sse.txt
      - name: Логи при ошибке
        if: failure()
        run: docker compose logs
