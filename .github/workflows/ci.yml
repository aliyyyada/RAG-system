name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend — линтер, миграции, тесты
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://rag:rag@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check . ../scripts/bench
          ruff format --check . ../scripts/bench
      - name: Миграции применяются и откатываются
        env:
          DATABASE_URL: postgresql+asyncpg://rag:rag@localhost:5432/rag
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Pytest
        run: pytest -v

  frontend:
    name: Frontend — типы, сборка, e2e (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16-bookworm
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://rag:rag@localhost:5432/rag
      EXTERNAL_AUTH_URL: https://localhost:8443/auth/check
      EXTERNAL_AUTH_CA_FILE: ${{ github.workspace }}/certs/server.crt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend + фейковый внешний сервис
        working-directory: backend
        run: |
          pip install -r requirements.txt
          ../scripts/dev-cert.sh
          alembic upgrade head
          python -m app.cli seed-test-users
          nohup uvicorn fakes.fake_service:app --port 8443 \
            --ssl-certfile ../certs/server.crt --ssl-keyfile ../certs/server.key > /tmp/fake.log 2>&1 &
          nohup uvicorn app.main:app --port 8000 > /tmp/app.log 2>&1 &
      - name: Типы и сборка
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Playwright
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          nohup npx vite preview --port 4173 --strictPort > /tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do curl -skf https://localhost:4173/api/health && break; sleep 1; done
          npx playwright test
      - name: Отчёт Playwright и логи при ошибке
        if: failure()
        run: cat /tmp/app.log /tmp/fake.log /tmp/vite.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    name: Docker — сборка образов и smoke-тест
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.cpu.yml config -q
      - name: Сборка образов
        run: docker compose build
      - name: Smoke-тест — proxy (TLS) + app + postgres без GPU
        run: |
          ./scripts/dev-cert.sh
          docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d proxy app
          for i in $(seq 1 30); do
            curl -skf https://localhost/api/health/ready && break
            sleep 2
          done
          curl -skf https://localhost/api/health/ready
          # Обычный HTTP только перенаправляет на HTTPS
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = "301"
          # Поток SSE доходит через nginx с heartbeat
          curl -skN --max-time 10 "https://localhost/api/diag/sse?seconds=5" | tee /tmp/sse.txt
          grep -q ": ping" /tmp/sse.txt
          grep -q "event: done" /tmp/sse.txt
          # Фронтенд отдаётся nginx, адреса SPA (например /login) ведут на index.html
          curl -skf https://localhost/login | grep -q "Поиск по документам"
          # Гость получает только поиск по общим документам, админка без входа закрыта
          curl -skf https://localhost/api/auth/me | grep -q '"permissions":\["search.common"\]'
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/api/admin/users)" = "401"
      - name: Логи при ошибке
        if: failure()
        run: docker compose logs
